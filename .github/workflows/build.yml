
name: Backend - Build and Deploy

on:
  push:
    branches: [UAT]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-deploy-${{ github.event.repository.name }}
  cancel-in-progress: false

# CHANGE THESE VALUES FOR EACH BACKEND PROJECT
env:
  PROJECT_NAME: "aduora-school-backend"
  DOTNET_VERSION: "8.0.x"
  PROJECT_FILE: "sms.api.csproj"
  DLL_NAME: "sms.api.dll"

  DEPLOY_DIR: "/var/www/Aduora/School-Backend"
  SERVICE_NAME: "aduora-school-backend"
  APP_PORT: "5083"
  API_DOMAIN: "schoolapi.aduora.com"

jobs:
  build:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout UAT
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Dependencies
        run: dotnet restore "${{ env.PROJECT_FILE }}"

      - name: Publish Backend
        run: |
          dotnet publish "${{ env.PROJECT_FILE }}" \
            --configuration Release \
            --no-restore \
            --output "$GITHUB_WORKSPACE/publish"

      - name: Verify Publish
        run: |
          test -f "publish/${{ env.DLL_NAME }}"
          test -f "publish/${{ env.DLL_NAME }}"
          ls -lah publish/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: publish/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-publish
          path: publish/

      - name: Upload to Ubuntu
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "publish/"
          target: "/tmp/${{ env.SERVICE_NAME }}-deploy/"
          overwrite: true

      - name: Configure Service and Deploy
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          SERVICE_NAME: ${{ env.SERVICE_NAME }}
          DLL_NAME: ${{ env.DLL_NAME }}
          APP_PORT: ${{ env.APP_PORT }}
          API_DOMAIN: ${{ env.API_DOMAIN }}
          SSL_EMAIL: ${{ secrets.SSL_EMAIL }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: DEPLOY_DIR,SERVICE_NAME,DLL_NAME,APP_PORT,API_DOMAIN,SSL_EMAIL
          command_timeout: 15m
          script: |
            set -eu

            UPLOAD="/tmp/${SERVICE_NAME}-deploy/publish"
            SERVICE_FILE="/etc/systemd/system/${SERVICE_NAME}.service"

            echo "Checking uploaded files..."
            test -f "$UPLOAD/$DLL_NAME"
            test -f "$UPLOAD/$(basename "$DLL_NAME" .dll).runtimeconfig.json"
            sudo test -d "$DEPLOY_DIR"

            echo "Checking port availability..."
            if sudo ss -lnt | grep -qE ":${APP_PORT}[[:space:]]"; then
              if ! sudo systemctl is-active --quiet "$SERVICE_NAME"; then
                echo "ERROR: Port $APP_PORT is occupied by another process."
                exit 1
              fi
            fi

            echo "Deploying application files..."
            sudo rsync -rt \
              --exclude='appsettings.json' \
              --exclude='appsettings.*.json' \
              "$UPLOAD/" "$DEPLOY_DIR/"

            echo "Creating systemd service..."
            sudo tee "$SERVICE_FILE" >/dev/null <<EOF
            [Unit]
            Description=${SERVICE_NAME}
            After=network.target

            [Service]
            WorkingDirectory=${DEPLOY_DIR}
            ExecStart=/usr/bin/dotnet ${DEPLOY_DIR}/${DLL_NAME}
            Environment=ASPNETCORE_ENVIRONMENT=Production
            Environment=ASPNETCORE_URLS=http://127.0.0.1:${APP_PORT}
            User=www-data
            Restart=always
            RestartSec=10

            [Install]
            WantedBy=multi-user.target
            EOF

            sudo systemctl daemon-reload
            sudo systemctl enable "$SERVICE_NAME"
            sudo systemctl restart "$SERVICE_NAME"

            sleep 5
            if ! sudo systemctl is-active --quiet "$SERVICE_NAME"; then
              sudo journalctl -u "$SERVICE_NAME" -n 80 --no-pager
              exit 1
            fi

            echo "Configuring Nginx..."
            sudo tee "/etc/nginx/sites-available/${API_DOMAIN}" >/dev/null <<EOF
            server {
                listen 80;
                listen [::]:80;
                server_name ${API_DOMAIN};

                client_max_body_size 25M;

                location / {
                    proxy_pass http://127.0.0.1:${APP_PORT};
                    proxy_http_version 1.1;
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                    proxy_set_header Upgrade \$http_upgrade;
                    proxy_set_header Connection "upgrade";
                }
            }
            EOF

            if [ ! -e "/etc/nginx/sites-enabled/${API_DOMAIN}" ]; then
              sudo ln -s "/etc/nginx/sites-available/${API_DOMAIN}" \
                "/etc/nginx/sites-enabled/${API_DOMAIN}"
            fi

            sudo nginx -t
            sudo systemctl reload nginx

            echo "Checking DNS..."
            if ! getent ahostsv4 "$API_DOMAIN" >/dev/null; then
              echo "ERROR: $API_DOMAIN does not resolve to an IP yet."
              exit 1
            fi

            if [ -n "${SSL_EMAIL:-}" ]; then
              sudo certbot --nginx --non-interactive \
                --agree-tos --email "$SSL_EMAIL" \
                -d "$API_DOMAIN"
            else
              echo "SSL_EMAIL missing; SSL issuance skipped."
            fi

            echo "Testing local API listener..."
            curl -sS --max-time 10 \
              "http://127.0.0.1:${APP_PORT}/" \
              -o /dev/null || echo "Root route may not be defined; check API endpoints."

            rm -rf "/tmp/${SERVICE_NAME}-deploy"
            echo "Backend deployment completed."
