
name: Aduora School API - UAT Deploy

on:
  push:
    branches:
      - UAT
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aduora-school-api-uat
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy to Windows IIS
    runs-on: [self-hosted, Windows, X64, aduora-school-api]
    timeout-minutes: 30

    env:
      PROJECT_FILE: sms.api.csproj
      DEPLOY_PATH: 'C:\inetpub\wwwroot\Aduora-School-Backend'
      APP_POOL: api-school-aduora

    steps:
      # 1. Checkout UAT branch
      - name: Checkout UAT branch
        uses: actions/checkout@v4

      # 2. Verify .NET SDK and project
      - name: Verify .NET SDK and project
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          dotnet --info

          if (!(Test-Path $env:PROJECT_FILE)) {
            throw "Project file not found: $env:PROJECT_FILE"
          }

          Write-Host "Project found: $env:PROJECT_FILE"

      # 3. Restore and publish
      - name: Build and Publish
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $publishPath = Join-Path $env:RUNNER_TEMP 'AduoraSchoolAPI-Publish'

          if (Test-Path $publishPath) {
            Remove-Item $publishPath -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $publishPath |
            Out-Null

          dotnet restore $env:PROJECT_FILE

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet restore failed"
          }

          dotnet publish $env:PROJECT_FILE `
            --configuration Release `
            --no-restore `
            --output $publishPath

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed"
          }

          if (!(Test-Path (Join-Path $publishPath 'sms.api.dll'))) {
            throw "Published sms.api.dll not found"
          }

          if (!(Test-Path (Join-Path $publishPath 'web.config'))) {
            throw "Published web.config not found"
          }

          Write-Host "Build and publish completed successfully."

      # 4. Deploy directly without backup
      - name: Deploy to IIS
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $publishPath = Join-Path $env:RUNNER_TEMP 'AduoraSchoolAPI-Publish'
          $target = $env:DEPLOY_PATH
          $pool = $env:APP_POOL

          Import-Module WebAdministration

          if (!(Test-Path $publishPath)) {
            throw "Publish folder not found: $publishPath"
          }

          if (!(Test-Path (Join-Path $publishPath 'sms.api.dll'))) {
            throw "Published sms.api.dll not found"
          }

          if (!(Test-Path (Join-Path $publishPath 'web.config'))) {
            throw "Published web.config not found"
          }

          if (!(Test-Path $target)) {
            throw "Existing deployment folder not found: $target"
          }

          if (!(Test-Path "IIS:\AppPools\$pool")) {
            throw "IIS App Pool not found: $pool"
          }

          $wasStarted = (Get-WebAppPoolState -Name $pool).Value -eq 'Started'

          try {
            if ($wasStarted) {
              Stop-WebAppPool -Name $pool

              $deadline = (Get-Date).AddSeconds(60)

              do {
                Start-Sleep -Seconds 2
                $state = (Get-WebAppPoolState -Name $pool).Value
              } while (
                $state -ne 'Stopped' -and
                (Get-Date) -lt $deadline
              )

              if ($state -ne 'Stopped') {
                throw "App Pool did not stop within 60 seconds."
              }
            }

            robocopy $publishPath $target `
              /MIR /COPY:DAT /DCOPY:DAT /R:2 /W:2

            $copyExitCode = $LASTEXITCODE

            if ($copyExitCode -ge 8) {
              throw "Deployment copy failed. Robocopy exit code: $copyExitCode"
            }

            if (!(Test-Path (Join-Path $target 'sms.api.dll'))) {
              throw "Deployment validation failed: sms.api.dll missing."
            }

            if (!(Test-Path (Join-Path $target 'web.config'))) {
              throw "Deployment validation failed: web.config missing."
            }

            Write-Host "Deployment files copied and validated."
          }
          finally {
            if ($wasStarted) {
              Start-WebAppPool -Name $pool
              Write-Host "App Pool start requested: $pool"
            }
          }

          Write-Host "Deployment completed."

      # 5. Verify deployed files
      - name: Verify Deployment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $dll = Join-Path $env:DEPLOY_PATH 'sms.api.dll'
          $config = Join-Path $env:DEPLOY_PATH 'web.config'

          if (!(Test-Path $dll)) {
            throw "Deployment verification failed: $dll missing"
          }

          if (!(Test-Path $config)) {
            throw "Deployment verification failed: $config missing"
          }

          Get-Item $dll, $config |
            Select-Object FullName, Length, LastWriteTime |
            Format-Table -AutoSize

          Write-Host "Deployment verification completed."
