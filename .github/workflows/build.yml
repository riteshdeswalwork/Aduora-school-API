
name: Aduora School API - UAT Deploy

on:
  push:
    branches:
      - UAT
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aduora-school-api-uat
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy to Windows IIS
    runs-on: [self-hosted, Windows, X64, aduora-school-api]
    timeout-minutes: 30

    env:
      PROJECT_FILE: sms.api.csproj
      DEPLOY_PATH: 'C:\inetpub\wwwroot\Aduora-School-Backend'

    steps:
      # 1. Checkout UAT branch
      - name: Checkout UAT branch
        uses: actions/checkout@v4

      # 2. Verify project and .NET SDK
      - name: Verify .NET SDK and Project
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "===== .NET SDK ====="
          dotnet --info

          if (!(Test-Path $env:PROJECT_FILE)) {
            throw "Project file not found: $env:PROJECT_FILE"
          }

          Write-Host "Project found: $env:PROJECT_FILE"

      # 3. Restore and publish
      - name: Build and Publish
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $publishPath = Join-Path $env:RUNNER_TEMP 'AduoraSchoolAPI-Publish'

          if (Test-Path $publishPath) {
            Remove-Item $publishPath -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $publishPath |
            Out-Null

          Write-Host "===== RESTORE ====="
          dotnet restore $env:PROJECT_FILE

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet restore failed."
          }

          Write-Host "===== PUBLISH ====="
          dotnet publish $env:PROJECT_FILE `
            --configuration Release `
            --no-restore `
            --output $publishPath

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed."
          }

          if (!(Test-Path (Join-Path $publishPath 'sms.api.dll'))) {
            throw "Published sms.api.dll not found."
          }

          if (!(Test-Path (Join-Path $publishPath 'web.config'))) {
            throw "Published web.config not found."
          }

          Write-Host "Build and publish successful."

      # 4. Deploy without backup
      - name: Deploy to IIS
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $publishPath = Join-Path $env:RUNNER_TEMP 'AduoraSchoolAPI-Publish'
          $target = $env:DEPLOY_PATH
          $offlineFile = Join-Path $target 'app_offline.htm'
          $publishOffline = Join-Path $publishPath 'app_offline.htm'

          if (!(Test-Path $publishPath)) {
            throw "Publish directory not found: $publishPath"
          }

          if (!(Test-Path $target)) {
            throw "Existing deployment directory not found: $target"
          }

          if (!(Test-Path (Join-Path $publishPath 'sms.api.dll'))) {
            throw "Published sms.api.dll not found."
          }

          if (!(Test-Path (Join-Path $publishPath 'web.config'))) {
            throw "Published web.config not found."
          }

          # Create an offline marker in the publish output.
          Set-Content -Path $publishOffline `
            -Value '<html><body>Application updating. Please retry shortly.</body></html>' `
            -Encoding ASCII

          $deploymentSucceeded = $false

          try {
            # Tell ASP.NET Core Module to take this app offline.
            Set-Content -Path $offlineFile `
              -Value '<html><body>Application updating. Please retry shortly.</body></html>' `
              -Encoding ASCII

            Start-Sleep -Seconds 5

            Write-Host "===== COPYING PUBLISHED FILES ====="

            robocopy $publishPath $target `
              /MIR /COPY:DAT /DCOPY:DAT /R:2 /W:2

            $copyExitCode = $LASTEXITCODE

            if ($copyExitCode -ge 8) {
              throw "Robocopy failed with exit code $copyExitCode."
            }

            if (!(Test-Path (Join-Path $target 'sms.api.dll'))) {
              throw "Deployment validation failed: sms.api.dll missing."
            }

            if (!(Test-Path (Join-Path $target 'web.config'))) {
              throw "Deployment validation failed: web.config missing."
            }

            $deploymentSucceeded = $true
            Write-Host "Deployment files validated successfully."
          }
          finally {
            # Remove the offline marker so IIS can serve the application.
            if (Test-Path $offlineFile) {
              Remove-Item $offlineFile -Force
            }

            if (Test-Path $publishOffline) {
              Remove-Item $publishOffline -Force
            }
          }

          if (!$deploymentSucceeded) {
            throw "Deployment did not complete successfully."
          }

          Write-Host "Deployment completed."

      # 5. Verify deployment
      - name: Verify Deployment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          $target = $env:DEPLOY_PATH
          $dll = Join-Path $target 'sms.api.dll'
          $config = Join-Path $target 'web.config'
          $offlineFile = Join-Path $target 'app_offline.htm'

          if (!(Test-Path $dll)) {
            throw "Verification failed: sms.api.dll missing."
          }

          if (!(Test-Path $config)) {
            throw "Verification failed: web.config missing."
          }

          if (Test-Path $offlineFile) {
            throw "Verification failed: app_offline.htm still exists."
          }

          Get-Item $dll, $config |
            Select-Object FullName, Length, LastWriteTime |
            Format-Table -AutoSize

          Write-Host "Deployment verification successful."
